<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta | Rango</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../Style.css">
<link rel="stylesheet" href="Login-style.css">
</head>
<body class="login-body">

  <!-- ===================== HEADER SIMPLES ===================== -->
  <header class="header">
    <div class="header__inner">
      <a href="../index.html" class="logo" id="btn-logo">
        <span class="logo__mark">R</span>
        <span class="logo__text">Rango</span>
      </a>
    </div>
  </header>

  <!-- ===================== CADASTRO ===================== -->
  <main class="login-main">
    <section class="login-card">
      <p class="login-card__eyebrow">Bem-vindo ao Rango</p>
      <h1 class="login-card__title">Criar conta</h1>
      <p class="login-card__subtitle">Preencha seus dados para começar a pedir.</p>
      
      <form class="login-form" id="form-cadastro" action="#" method="get">

        <div class="login-form__group">
          <label for="input-nome">Nome completo</label>
          <input
            type="text"
            id="input-nome"
            name="nome"
            placeholder="Digite seu nome completo"
            autocomplete="name"
          >
        </div>

        <div class="login-form__group">
          <label for="input-endereco">Endereço</label>
          <input
            type="text"
            id="input-endereco"
            name="endereco"
            placeholder="Rua, número, bairro, cidade"
            autocomplete="street-address"
          >
        </div>

        <div class="login-form__row">
          <div class="login-form__group">
            <label for="input-email">E-mail</label>
            <input
              type="email"
              id="input-email"
              name="email"
              placeholder="email@exemplo.com"
              autocomplete="email"
            >
          </div>

          <div class="login-form__group">
            <label for="input-telefone">Telefone</label>
            <input
              type="tel"
              id="input-telefone"
              name="telefone"
              placeholder="(00) 00000-0000"
              autocomplete="tel"
            >
          </div>
        </div>

        <div class="login-form__group">
          <label for="input-cpf">CPF</label>
          <input
            type="text"
            id="input-cpf"
            name="cpf"
            placeholder="000.000.000-00"
            inputmode="numeric"
            maxlength="14"
            autocomplete="off"
          >
        </div>

        <div class="login-form__group">
          <label for="input-senha">Senha</label>
          <input
            type="password"
            id="input-senha"
            name="senha"
            placeholder="Crie uma senha"
            autocomplete="new-password"
          >
        </div>

        <button type="submit" class="btn btn--primary btn--lg login-form__submit" id="btn-cadastro-submit">
          Criar conta
        </button>

      </form>

      <p class="login-card__footer">
        Já tem uma conta?
        <a href="Login.html" id="link-login">Entrar</a>
      </p>

      <a href="../index.html" class="login-card__voltar" id="link-voltar">← Voltar para o início</a>
    </section>
  </main>
</body>
</html>
