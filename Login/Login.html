<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar | Rango</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="Login-style.css">
</head>
<body class="login-body">

  <!-- ===================== HEADER SIMPLES ===================== -->
  <header class="header">
    <div class="header__inner">
      <a href="index.html" class="logo" id="btn-logo">
        <span class="logo__mark">R</span>
        <span class="logo__text">Rango</span>
      </a>
    </div>
  </header>

  <!-- ===================== LOGIN ===================== -->
  <main class="login-main">
    <section class="login-card">
      <p class="login-card__eyebrow">Bem-vindo de volta</p>
      <h1 class="login-card__title">Entrar no Rango</h1>
      <p class="login-card__subtitle">Digite seu e-mail e senha para continuar.</p>

      <!--
        Formulário sem lógica: sem action real e sem <script>.
        O colega responsável pelo JS pode usar os ids dos campos abaixo
        (ex: document.getElementById('input-email')) para validar e enviar.
      -->
      <form class="login-form" id="form-login" action="#" method="get">

        <div class="login-form__group">
          <label for="input-email">E-mail</label>
          <input
            type="email"
            id="input-email"
            name="email"
            placeholder="email@exemplo.com"
            autocomplete="email"
          >
        </div>

        <div class="login-form__group">
          <label for="input-senha">Senha</label>
          <input
            type="password"
            id="input-senha"
            name="senha"
            placeholder="Digite sua senha"
            autocomplete="current-password"
          >
        </div>

        <a href="#" class="login-form__esqueci" id="link-esqueci-senha">Esqueci minha senha</a>

        <button type="submit" class="btn btn--primary btn--lg login-form__submit" id="btn-login-submit">
          Entrar
        </button>

      </form>

      <p class="login-card__footer">
        Ainda não tem conta?
        <a href="cadastro.html" id="link-cadastro">Cadastre-se</a>
      </p>

      <a href="index.html" class="login-card__voltar" id="link-voltar">← Voltar para o início</a>
    </section>
  </main>

  <!--
    OBS PARA O GRUPO:
    Nenhum <script> foi incluído de propósito. O colega do JS ainda precisa:
    - Validar os campos (email, senha)
    - Tratar o envio do #form-login (hoje o botão #btn-login-submit não faz nada real)
    - Ligar o link #link-esqueci-senha caso precise de comportamento extra
  -->
</body>
</html>
