<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar | Rango</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="Login-style.css">
</head>
<body class="login-body">

  <!-- ===================== HEADER SIMPLES ===================== -->
  <header class="header">
    <div class="header__inner">
      <a href="index.html" class="logo" id="btn-logo">
        <span class="logo__mark">R</span>
        <span class="logo__text">Rango</span>
      </a>
    </div>
  </header>

  <!-- ===================== LOGIN ===================== -->
  <main class="login-main">
    <section class="login-card">
      <p class="login-card__eyebrow">Bem-vindo de volta</p>
      <h1 class="login-card__title">Entrar no Rango</h1>
      <p class="login-card__subtitle">Preencha seus dados para continuar.</p>

      <form class="login-form" id="form-login" action="#" method="get">

        <div class="login-form__group">
          <label for="input-nome">Nome completo</label>
          <input
            type="text"
            id="input-nome"
            name="nome"
            placeholder="Digite seu nome completo"
            autocomplete="name"
          >
        </div>

        <div class="login-form__group">
          <label for="input-endereco">Endereço</label>
          <input
            type="text"
            id="input-endereco"
            name="endereco"
            placeholder="Rua, número, bairro, cidade"
            autocomplete="street-address"
          >
        </div>

        <div class="login-form__row">
          <div class="login-form__group">
            <label for="input-email">E-mail</label>
            <input
              type="email"
              id="input-email"
              name="email"
              placeholder="email@exemplo.com"
              autocomplete="email"
            >
          </div>

          <div class="login-form__group">
            <label for="input-telefone">Telefone</label>
            <input
              type="tel"
              id="input-telefone"
              name="telefone"
              placeholder="(00) 00000-0000"
              autocomplete="tel"
            >
          </div>
        </div>

        <div class="login-form__group">
          <label for="input-cpf">CPF</label>
          <input
            type="text"
            id="input-cpf"
            name="cpf"
            placeholder="000.000.000-00"
            inputmode="numeric"
            maxlength="14"
            autocomplete="off"
          >
        </div>

        <button type="submit" class="btn btn--primary btn--lg login-form__submit" id="btn-login-submit">
          Entrar
        </button>

      </form>

      <p class="login-card__footer">
        Ainda não tem conta?
        <a href="#" id="link-cadastro">Cadastre-se</a>
      </p>

      <a href="index.html" class="login-card__voltar" id="link-voltar">← Voltar para o início</a>
    </section>
  </main>

  <!--
    OBS
    Nenhum <script> foi incluído. O VINIMIL ainda precisa:
    - Validar os campos (nome, endereço, email, telefone, cpf)
    - Tratar o envio do #form-login (hoje o botão #btn-login-submit não faz nada real)
    - Ligar os links #link-cadastro e #link-voltar caso precise de comportamento extra
  -->
</body>
</html>
